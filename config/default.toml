[app]
environment = "production"
log_level = "info"

[market_data]
symbols = ["BTCUSDT", "ETHUSDT"]
binance_ws_url = "wss://stream.bybit.com/v5/public/spot"
binance_rest_url = "https://api.bybit.com"
reconnect_interval_ms = 2000
channel_buffer_size = 20000

[storage]
database_url = "postgres://postgres:postgres@127.0.0.1:5432/miedte"
redis_url = "redis://127.0.0.1:6379"
enable_db_persistence = false

[trading]
initial_capital = 100000.0
notional_per_trade = 30000.0    # حجم ۳۰ هزار دلاری برای سودهای چشمگیر ۱۵۰ تا ۲۰۰ دلاری
take_profit_bps = 50.0          # تارگت سود قدرتمند +0.50% (+150$ سود خالص)
stop_loss_bps = 20.0            # استاپ کنترل‌شده -0.20% (-60$)
breakeven_trigger_bps = 15.0    # قفل کارمزد و سود در +0.15%
max_holding_seconds = 180       # ۳ دقیقه فرصت برای پرواز امواج سود
max_spread_bps = 1.0
min_ml_confidence = 0.70