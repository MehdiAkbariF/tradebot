[app]
environment = "production"
log_level = "info"

[market_data]
symbols = ["BTCUSDT", "ETHUSDT"]
binance_ws_url = "wss://stream.bybit.com/v5/public/spot"
binance_rest_url = "https://api.bybit.com"
reconnect_interval_ms = 3000
channel_buffer_size = 50000

[storage]
database_url = "postgres://postgres:postgres@localhost:5432/tradebot"
redis_url = "redis://127.0.0.1:6379"
enable_db_persistence = false

[trading]
initial_capital = 100.0
notional_per_trade = 30.0
take_profit_bps = 60.0
stop_loss_bps = 35.0
breakeven_trigger_bps = 25.0
max_holding_seconds = 900
max_spread_bps = 3.0
min_ml_confidence = 0.85
maker_fee_bps = 2.0
min_volatility_bps = 3.5
maker_timeout_seconds = 10