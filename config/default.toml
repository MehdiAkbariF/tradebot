[app]
environment = "production"
log_level = "info"

[market_data]
symbols = ["BTCUSDT", "ETHUSDT"]
binance_ws_url = "wss://stream.bybit.com/v5/public/spot"
binance_rest_url = "https://api.bybit.com"
reconnect_interval_ms = 3000
channel_buffer_size = 50000

[storage]
database_url = "postgres://postgres:postgres@localhost:5432/tradebot"
redis_url = "redis://127.0.0.1:6379"
enable_db_persistence = false

[trading]
initial_capital = 100.0           # 👈 تغییر از 100000 به 100 دلار واقعی
notional_per_trade = 30.0         # 👈 حجم پیش‌فرض 30 دلار
take_profit_bps = 14.0
stop_loss_bps = 14.0
breakeven_trigger_bps = 8.0
max_holding_seconds = 120
max_spread_bps = 2.0
min_ml_confidence = 0.85
maker_fee_bps = 2.0
min_volatility_bps = 1.2
maker_timeout_seconds = 5