[app]
environment = "production"
log_level = "info"

[market_data]
symbols = ["BTCUSDT", "ETHUSDT"]
binance_ws_url = "wss://stream.bybit.com/v5/public/spot"
binance_rest_url = "https://api.bybit.com"
reconnect_interval_ms = 2000
channel_buffer_size = 20000

[storage]
database_url = "postgres://postgres:postgres@127.0.0.1:5432/miedte"
redis_url = "redis://127.0.0.1:6379"
enable_db_persistence = false

[trading]
initial_capital = 100000.0
notional_per_trade = 15000.0
take_profit_bps = 25.0
stop_loss_bps = 15.0
breakeven_trigger_bps = 8.0
max_holding_seconds = 60
max_spread_bps = 1.0
min_ml_confidence = 0.65
maker_fee_bps = 1.0
min_volatility_bps = 5.0
maker_timeout_seconds = 5